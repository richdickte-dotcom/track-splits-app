<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track & Field Split Times Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const DISTANCES = [
      { name: '400m', meters: 400, defaultLap: 100 },
      { name: '800m', meters: 800, defaultLap: 200 },
      { name: '1500m', meters: 1500, defaultLap: 400 },
      { name: '1600m / 1 Mile', meters: 1609.34, defaultLap: 400 },
      { name: '3000m', meters: 3000, defaultLap: 400 },
      { name: '5000m / 5K', meters: 5000, defaultLap: 400 },
      { name: '10,000m / 10K', meters: 10000, defaultLap: 400 }
    ];

    function App() {
      const [mode, setMode] = useState('log'); // 'log' or 'target'
      const [selectedDistance, setSelectedDistance] = useState(DISTANCES[2]);
      const [lapDist, setLapDist] = useState(400);
      const [splits, setSplits] = useState([]);
      const [currentInput, setCurrentInput] = useState('');
      
      // Target Mode state
      const [targetTimeStr, setTargetTimeStr] = useState('04:15.0');
      const [paceStrategy, setPaceStrategy] = useState('even'); // 'even', 'negative', 'positive'

      // Helper calculations
      const parseTimeToSec = (str) => {
        if (!str) return 0;
        const parts = str.trim().split(':');
        if (parts.length === 2) {
          return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
        }
        return parseFloat(parts[0]) || 0;
      };

      const formatSecToTime = (sec) => {
        if (isNaN(sec) || sec <= 0) return '00:00.0';
        const mins = Math.floor(sec / 60);
        const secs = (sec % 60).toFixed(1);
        const paddedSecs = secs < 10 ? '0' + secs : secs;
        return mins > 0 ? `${mins}:${paddedSecs}` : `${secs}s`;
      };

      const handleAddSplit = (e) => {
        e.preventDefault();
        const sec = parseTimeToSec(currentInput);
        if (sec <= 0) return;
        setSplits([...splits, { text: currentInput, sec }]);
        setCurrentInput('');
      };

      const totalSplitsSec = useMemo(() => splits.reduce((a, b) => a + b.sec, 0), [splits]);
      const avgSplitSec = useMemo(() => splits.length > 0 ? totalSplitsSec / splits.length : 0, [splits, totalSplitsSec]);
      
      const fastestLap = useMemo(() => {
        if (splits.length === 0) return null;
        return Math.min(...splits.map(s => s.sec));
      }, [splits]);

      const slowestLap = useMemo(() => {
        if (splits.length === 0) return null;
        return Math.max(...splits.map(s => s.sec));
      }, [splits]);

      // Target splits generator
      const targetSplits = useMemo(() => {
        const totalSec = parseTimeToSec(targetTimeStr);
        if (totalSec <= 0) return [];
        const totalLaps = Math.ceil(selectedDistance.meters / lapDist);
        const baseLap = totalSec / totalLaps;

        return Array.from({ length: totalLaps }, (_, i) => {
          let multiplier = 1;
          if (paceStrategy === 'negative') {
            multiplier = 1.04 - (i / (totalLaps - 1 || 1)) * 0.08; // starts 4% slower, ends 4% faster
          } else if (paceStrategy === 'positive') {
            multiplier = 0.96 + (i / (totalLaps - 1 || 1)) * 0.08; // starts 4% faster, ends 4% slower
          }
          return baseLap * multiplier;
        });
      }, [targetTimeStr, selectedDistance, lapDist, paceStrategy]);

      return (
        <div className="max-w-2xl mx-auto space-y-4 font-sans">
          {/* Header */}
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap justify-between items-center gap-3">
            <div>
              <h1 className="text-xl font-bold text-emerald-400 flex items-center gap-2">
                ⏱️ Track & Field Splits
              </h1>
              <p className="text-xs text-slate-400">Analysis & Target Generator</p>
            </div>
            
            <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700 text-xs">
              <button 
                onClick={() => setMode('log')}
                className={`px-3 py-1.5 rounded-md font-semibold transition ${mode === 'log' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                Splits Log
              </button>
              <button 
                onClick={() => setMode('target')}
                className={`px-3 py-1.5 rounded-md font-semibold transition ${mode === 'target' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                Target Generator
              </button>
            </div>
          </div>

          {/* Setup Controls */}
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 grid grid-cols-2 gap-3 text-xs">
            <div>
              <label className="text-slate-400 block mb-1">Event Distance</label>
              <select 
                value={selectedDistance.name}
                onChange={(e) => {
                  const dist = DISTANCES.find(d => d.name === e.target.value);
                  setSelectedDistance(dist);
                  setLapDist(dist.defaultLap);
                }}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
                {DISTANCES.map(d => <option key={d.name} value={d.name}>{d.name}</option>)}
              </select>
            </div>

            <div>
              <label className="text-slate-400 block mb-1">Interval Distance</label>
              <select 
                value={lapDist}
                onChange={(e) => setLapDist(Number(e.target.value))}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
                <option value={100}>100m</option>
                <option value={200}>200m</option>
                <option value={400}>400m</option>
              </select>
            </div>
          </div>

          {/* MODE 1: LOG & ANALYZE */}
          {mode === 'log' && (
            <div className="space-y-4">
              {/* Stat Summary Cards */}
              <div className="grid grid-cols-3 gap-2 text-center">
                <div className="bg-slate-800 p-3 rounded-xl border border-slate-700">
                  <div className="text-slate-400 text-xs">Total Time</div>
                  <div className="text-lg font-bold font-mono text-emerald-400 mt-
