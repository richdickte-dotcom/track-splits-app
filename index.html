<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Splits Calculator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    h1 {
      color: #34d399;
      text-align: center;
      margin-bottom: 24px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: white;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: #34d399;
    }
    button {
      background-color: #34d399;
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    li:last-child {
      border-bottom: none;
    }
    .lap-num { color: #94a3b8; }
    .lap-time { font-family: monospace; font-weight: bold; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏱️ Track Splits</h1>
    <div class="input-group">
      <input type="text" id="timeInput" placeholder="Lap time (e.g., 68.5 or 1:08.5)">
      <button onclick="addSplit()">Add</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Recorded Laps</h3>
      <ul id="splitsList">
        <li style="color:#94a3b8;">No split times entered yet.</li>
      </ul>
    </div>
  </div>

  <script>
    const splits = [];

    function addSplit() {
      const input = document.getElementById('timeInput');
      const val = input.value.trim();
      if (!val) return;

      splits.push(val);
      input.value = '';
      render();
    }

    function render() {
      const list = document.getElementById('splitsList');
      list.innerHTML = splits.map((s, i) => `
        <li>
          <span class="lap-num">Lap ${i + 1}</span>
          <span class="lap-time">${s}</span>
        </li>
      `).join('');
    }
  </script>
</body>
</html>
