<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track & Field Split Times Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen p-3 md:p-6">
  <div class="max-w-2xl mx-auto space-y-4">
    
    <!-- Header & Tab Toggle -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap justify-between items-center gap-3">
      <div>
        <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">⏱️ Track & Field Splits</h1>
        <p class="text-xs text-slate-400">Analysis & Target Generator</p>
      </div>
      <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700 text-xs">
        <button type="button" id="tabLog" onclick="switchMode('log')" class="px-3 py-1.5 rounded-md font-semibold bg-emerald-500 text-slate-950 transition">Splits Log</button>
        <button type="button" id="tabTarget" onclick="switchMode('target')" class="px-3 py-1.5 rounded-md font-semibold text-slate-400 hover:text-white transition">Target Generator</button>
      </div>
    </div>

    <!-- Distance Controls -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 grid grid-cols-2 gap-3 text-xs">
      <div>
        <label class="text-slate-400 block mb-1 font-semibold">Event Distance</label>
        <select id="eventDist" onchange="updateEventDistance()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none">
          <option value="400|100">400m</option>
          <option value="800|200">800m</option>
          <option value="1609.34|400" selected>1600m / 1 Mile</option>
          <option value="3200|400">3200m</option>
          <option value="5000|400">5000m / 5K</option>
          <option value="10000|400">10,000m / 10K</option>
        </select>
      </div>
      <div>
        <label class="text-slate-400 block mb-1 font-semibold">Interval Distance</label>
        <select id="lapDist" onchange="renderAll()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none">
          <option value="100">100m</option>
          <option value="200">200m</option>
          <option value="400" selected>400m</option>
        </select>
      </div>
    </div>

    <!-- TAB 1: SPLITS LOG & ANALYZER -->
    <div id="modeLog" class="space-y-4">
      
      <!-- Stopwatch Panel -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center space-y-3">
        <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Live Stopwatch</div>
        <div id="swDisplay" class="text-4xl font-extrabold font-mono text-emerald-400">00:00.0</div>
        
        <div class="flex justify-center gap-2 text-xs">
          <button type="button" id="swStartBtn" onclick="toggleStopwatch()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition w-24">Start</button>
          <button type="button" id="swLapBtn" onclick="lapStopwatch()" disabled class="bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg transition opacity-50 cursor-not-allowed w-24">Lap & Log</button>
          <button type="button" onclick="resetStopwatch()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold px-3 py-2 rounded-lg transition">Reset</button>
        </div>
      </div>

      <!-- Stats Summary -->
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
          <div class="text-slate-400 text-xs">Total Time</div>
          <div id="totalTime" class="text-lg font-bold font-mono text-emerald-400 mt-0.5">00:00.0</div>
        </div>
        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
          <div class="text-slate-400 text-xs">Avg Lap Pace</div>
          <div id="avgPace" class="text-lg font-bold font-mono text-cyan-400 mt-0.5">--</div>
        </div>
        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
          <div class="text-slate-400 text-xs">Total Laps</div>
          <div id="totalLaps" class="text-lg font-bold font-mono text-indigo-400 mt-0.5">0</div>
        </div>
      </div>

      <!-- Manual Input Form -->
      <form onsubmit="addSplit(event)" class="flex gap-2">
        <input type="text" id="timeInput" placeholder="Manual entry (e.g. 68.5 or 1:08.5)" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 font-bold px-4 py-2.5 rounded-xl text-slate-950 text-sm transition">Add Split</button>
      </form>

      <!-- Split Table & Pace Bars -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-semibold text-sm text-slate-200">Recorded Laps Analysis</h3>
          <button type="button" onclick="clearSplits()" class="text-xs text-rose-400 hover:underline">Clear All</button>
        </div>
        <div id="splitsContainer"></div>
      </div>
    </div>

    <!-- TAB 2: TARGET GENERATOR -->
    <div id="modeTarget" class="space-y-4" style="display: none;">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 grid grid-cols-2 gap-3 text-xs">
        <div>
          <label class="text-slate-400 block mb-1 font-semibold">Target Finish Time</label>
          <input type="text" id="targetTimeInput" value="04:40.0" oninput="renderTarget()" onkeyup="renderTarget()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white font-mono focus:outline-none">
        </div>
        <div>
          <label class="text-slate-400 block mb-1 font-semibold">Pacing Strategy</label>
          <select id="paceStrategy" onchange="renderTarget()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none">
            <option value="even">Even Pacing (Flat)</option>
            <option value="negative">Negative Split (Faster finish)</option>
            <option value="positive">Positive Split (Fast start)</option>
          </select>
        </div>
      </div>

      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-900/50 text-slate-400 border-b border-slate-700">
            <tr>
              <th class="p-3">Interval</th>
              <th class="p-3">Target Split</th>
              <th class="p-3">Cumulative</th>
            </tr>
          </thead>
          <tbody id="targetTableBody" class="divide-y divide-slate-700/50 font-mono"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let splits = [];
    
    // Stopwatch Variables
    let swTimer = null;
    let swStartTime = 0;
    let swElapsedTime = 0;
    let swLastLapTime = 0;
    let swIsRunning = false;

    function parseToSec(str) {
      if (!str) return 0;
      const clean = String(str).trim();
      if (clean.includes(':')) {
        const parts = clean.split(':');
        const mins = parseFloat(parts[0]) || 0;
        const secs = parseFloat(parts[1]) || 0;
        return (mins * 60) + secs;
      }
      return parseFloat(clean) || 0;
    }

    function formatSec(sec) {
      if (isNaN(sec) || sec <= 0) return '00:00.0';
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1);
      const mFormatted = m < 10 ? '0' + m : m;
      const sFormatted = s < 10 ? '0' + s : s;
      return `${mFormatted}:${sFormatted}`;
    }

    function toggleStopwatch() {
      const btn = document.getElementById('swStartBtn');
      const lapBtn = document.getElementById('swLapBtn');

      if (swIsRunning) {
        clearInterval(swTimer);
        swIsRunning = false;
        btn.innerText = 'Resume';
        btn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition w-24";
        lapBtn.disabled = true;
        lapBtn.className = "bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg transition opacity-50 cursor-not-allowed w-24";
      } else {
        swStartTime = Date.now() - swElapsedTime;
        swTimer = setInterval(updateStopwatch, 100);
        swIsRunning = true;
        btn.innerText = 'Pause';
        btn.className = "bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition w-24";
        lapBtn.disabled = false;
        lapBtn.className = "bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-lg transition opacity-100 cursor-pointer w-24";
      }
    }

    function updateStopwatch() {
      swElapsedTime = Date.now() - swStartTime;
      const disp = document.getElementById('swDisplay');
      if (disp) disp.innerText = formatSec(swElapsedTime / 1000);
    }

    function lapStopwatch() {
      if (!swIsRunning) return;
      const currentSec = swElapsedTime / 1000;
      const lapSec = currentSec - swLastLapTime;
      swLastLapTime = currentSec;

      const formatted = formatSec(lapSec);
      splits.push({ text: formatted, sec: lapSec });
      renderLog();
    }

    function resetStopwatch() {
      clearInterval(swTimer);
      swIsRunning = false;
      swElapsedTime = 0;
      swLastLapTime = 0;
      
      const disp = document.getElementById('swDisplay');
      if (disp) disp.innerText = '00:00.0';
      
      const btn = document.getElementById('swStartBtn');
      if (btn) {
        btn.innerText = 'Start';
        btn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition w-24";
      }
      
      const lapBtn = document.getElementById('swLapBtn');
      if (lapBtn) {
        lapBtn.disabled = true;
        lapBtn.className = "bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg transition opacity-50 cursor-not-allowed w-24";
      }
    }

    function switchMode(mode) {
      const modeLog = document.getElementById('modeLog');
      const modeTarget = document.getElementById('modeTarget');
      const tabLog = document.getElementById('tabLog');
      const tabTarget = document.getElementById('tabTarget');

      if (mode === 'log') {
        if (modeLog) modeLog.style.display = 'block';
        if (modeTarget) modeTarget.style.display = 'none';
        if (tabLog) tabLog.className = "px-3 py-1.5 rounded-md font-semibold bg-emerald-500 text-slate-950 transition";
        if (tabTarget) tabTarget.className = "px-3 py-1.5 rounded-md font-semibold text-slate-400 hover:text-white transition";
        renderLog();
      } else {
        if (modeLog) modeLog.style.display = 'none';
        if (modeTarget) modeTarget.style.display = 'block';
        if (tabTarget) tabTarget.className = "px-3 py-1.5 rounded-md font-semibold bg-emerald-500 text-slate-950 transition";
        if (tabLog) tabLog.className = "px-3 py-1.5 rounded-md font-semibold text-slate-400 hover:text-white transition";
        renderTarget();
      }
    }

    function updateEventDistance() {
      const distEl = document.getElementById('eventDist');
      if (!distEl) return;
      const parts = distEl.value.split('|');
      const lapEl = document.getElementById('lapDist');
      if (lapEl) lapEl.value = parts[1];
      renderAll();
    }

    function renderAll() {
      renderLog();
      renderTarget();
    }

    function addSplit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('timeInput');
      if (!input) return;
      const sec = parseToSec(input.value);
      if (sec <= 0) return;
      splits.push({ text: input.value.trim(), sec: sec });
      input.value = '';
      renderLog();
    }

    function clearSplits() {
      splits = [];
      resetStopwatch();
      renderLog();
    }

    function renderLog() {
      const container = document.getElementById('splitsContainer');
      const lapEl = document.getElementById('lapDist');
      const intervalMeters = lapEl ? parseInt(lapEl.value) : 400;

      if (!container) return;

      const totalTimeEl = document.getElementById('totalTime');
      const avgPaceEl = document.getElementById('avgPace');
      const totalLapsEl = document.getElementById('totalLaps');

      if (splits.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-xs text-center py-6">Enter split times above or use the Live Stopwatch to record laps.</p>';
        if (totalTimeEl) totalTimeEl.innerText = '00:00.0';
        if (avgPaceEl) avgPaceEl.innerText = '--';
        if (totalLapsEl) totalLapsEl.innerText = '0';
        return;
      }

      const totalSec = splits.reduce((acc, curr) => acc + curr.sec, 0);
      const avgSec = totalSec / splits.length;
      const fastest = Math.min(...splits.map(s => s.sec));
      const slowest = Math.max(...splits.map(s => s.sec));

      if (totalTimeEl) totalTimeEl.innerText = formatSec(totalSec);
      if (avgPaceEl) avgPaceEl.innerText = formatSec(avgSec);
      if (totalLapsEl) totalLapsEl.innerText = splits.length;

      let html = '<div class="space-y-3">';
      splits.forEach((s, idx) => {
        const isFastest = s.sec === fastest;
        const isSlowest = s.sec === slowest && splits.length > 1;
        const barWidth = Math.min(100, Math.max(20, (s.sec / slowest) * 100));

        let tag = '';
        if (isFastest) tag = '<span class="ml-2 text-emerald-400 font-bold text-[10px] bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-800">⚡ FASTEST</span>';
        if (isSlowest) tag = '<span class="ml-2 text-amber-400 font-bold text-[10px] bg-amber-950 px-1.5 py-0.5 rounded border border-amber-800">SLOWEST</span>';

        const colorClass = isFastest ? 'bg-emerald-400' : isSlowest ? 'bg-amber-400' : 'bg-cyan-500';

        html += `
          <div class="space-y-1">
            <div class="flex justify-between text-xs font-mono">
              <span class="text-slate-400">Lap ${idx + 1} (${intervalMeters * (idx + 1)}m) ${tag}</span>
              <span class="text-emerald-300 font-bold">${s.text} (${formatSec(s.sec)})</span>
            </div>
            <div class="h-2 w-full bg-slate-900 rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-300 ${colorClass}" style="width: ${barWidth}%"></div>
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function renderTarget() {
      const targetInput = document.getElementById('targetTimeInput');
      if (!targetInput) return;
      const targetStr = targetInput.value;
      const totalSec = parseToSec(targetStr);
      const tbody = document.getElementById('targetTableBody');

      if (!tbody) return;

      if (totalSec <= 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-3 text-center text-slate-500">Enter a valid target finish time.</td></tr>';
        return;
      }

      const eventEl = document.getElementById('eventDist');
      const eventParts = eventEl ? eventEl.value.split('|') : ['1609.34', '400'];
      const totalMeters = parseFloat(eventParts[0]) || 1609.34;
      const lapEl = document.getElementById('lapDist');
      const lapDist = lapEl ? parseInt(lapEl.value) : 400;
      const totalLaps = Math.ceil(totalMeters / lapDist);
      const baseLap = totalSec / totalLaps;
      
      const stratEl = document.getElementById('paceStrategy');
      const strategy = stratEl ? stratEl.value : 'even';

      let html = '';
      let cumSec = 0;

      for (let i = 0; i < totalLaps; i++) {
        let mult = 1;
        if (strategy === 'negative') {
          mult = 1.04 - (i / (totalLaps - 1 || 1)) * 0.08;
        } else if (strategy === 'positive') {
          mult = 0.96 + (i / (totalLaps - 1 || 1)) * 0.08;
        }

        const lapSec = baseLap * mult;
        cumSec += lapSec;
        const currentDist = Math.min(lapDist * (i + 1), Math.round(totalMeters));

        html += `
          <tr class="hover:bg-slate-700/30">
            <td class="p-3 text-slate-400">Lap ${i + 1} (${currentDist}m)</td>
            <td class="p-3 text-emerald-400 font-bold">${formatSec(lapSec)}</td>
            <td class="p-3 text-cyan-300">${formatSec(cumSec)}</td>
          </tr>
        `;
      }
      tbody.innerHTML = html;
    }

    // Initial load once DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
    });
  </script>
</body>
</html>
